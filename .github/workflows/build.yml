name: Paimon native cache ARM64 image and MinIO validation
on:
  push:
    branches: [feature/paimon-native-local-cache]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/build-connector.sh
      - name: Package native-cache ARM64 image
        run: |
          mkdir -p build/downloads
          BASE_IMAGE=$(python -c 'import json; print(json.load(open("artifacts.lock.json"))["base_image"])')
          docker pull --platform linux/arm64 "$BASE_IMAGE"
          docker save -o build/downloads/ubuntu-arm64.tar "$BASE_IMAGE"
          python scripts/package-image.py
          docker load -i dist/trino-paimon-iceberg-0.4.0-native-arm64.docker.tar.gz
          python tests/verify-image.py
      - name: Real MinIO SQL cold/hot/concurrency/snapshot/restart validation
        run: |
          pip install boto3==1.40.51
          python tests/smoke-docker.py
      - name: Source and deployment manual
        run: |
          mkdir -p build/source/trino-paimon-iceberg/media
          git archive HEAD | tar -x -C build/source/trino-paimon-iceberg
          cp dist/SHA256SUMS dist/IMAGE_ID build/source/trino-paimon-iceberg/media/
          tar -czf dist/trino-paimon-iceberg-0.4.0-native-source.tar.gz -C build/source trino-paimon-iceberg
          cp docs/NATIVE-CACHE-DOCKER.md dist/
          cp docs/TEST-VALIDATION.md dist/
          cp vendor/target/paimon-trino-484-2.1.0-tests.jar dist/
          cd dist
          rm -f ROOTFS_PATH
          sha256sum *.tar.gz *.md *.json *.jar IMAGE_ID > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paimon-native-cache-arm64
          path: dist/*
          compression-level: 0
  release:
    if: github.ref == 'refs/heads/feature/paimon-native-local-cache' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paimon-native-cache-arm64
          path: artifacts
      - name: Publish isolated native-cache prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.0-native artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "v0.4.0-native Paimon local cache ARM64" --notes "Isolated native-cache branch. Includes ARM64 Docker image, source, step-by-step manual, and real MinIO validation report. Paimon uses native local cache; Iceberg is retained without file caching."
